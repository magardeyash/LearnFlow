server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/learnflow}
spring.data.mongodb.database=${SPRING_MONGODB_DATABASE:learnflow}

# JWT Security Configuration (Requires at least 256 bits / 32 characters key)
jwt.secret=${JWT_SECRET:}
jwt.expiry=${JWT_EXPIRY:604800000}

# Google OAuth2 Credentials
google.client.id=${GOOGLE_CLIENT_ID:}

# AWS S3 Configuration
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Spring Mail Server (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
