server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${SPRING_MONGODB_DATABASE:learnflow}

# JWT Security Configuration (Requires at least 256 bits / 32 characters key)
jwt.secret=${JWT_SECRET:your_super_secret_key_which_must_be_at_least_32_characters_long_for_security}
jwt.expiry=${JWT_EXPIRY:604800000}

# Google OAuth2 Credentials
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id}

# AWS S3 Configuration
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:learnflow-uploads}
aws.access-key=${AWS_ACCESS_KEY:your_aws_access_key}
aws.secret-key=${AWS_SECRET_KEY:your_aws_secret_key}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

# Spring Mail Server (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
